<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | BNI Brasil</title>
<!-- Página de erro do lps-bni.vercel.app. Também é a de pages.bnibrasil.com.br
     para caminhos que não existem nem lá nem aqui (o bni-lp repassa para cá o
     que não é dele). Mesmo desenho do 404 padrão do Next.js, em português. -->
<style>
  body {
    margin: 0;
    color: #000;
    background: #fff;
    font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  }
  main {
    min-height: 100vh;
    min-height: 100svh;
    box-sizing: border-box;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 {
    display: inline-block;
    margin: 0 20px 0 0;
    padding: 0 23px 0 0;
    font-size: 24px;
    font-weight: 500;
    line-height: 49px;
    vertical-align: top;
    border-right: 1px solid rgba(0, 0, 0, .3);
  }
  p {
    display: inline-block;
    margin: 0;
    font-size: 14px;
    font-weight: 400;
    line-height: 49px;
  }
  a {
    display: inline-block;
    margin-top: 16px;
    font-size: 14px;
    color: inherit;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #fff; background: #000; }
    h1 { border-right-color: rgba(255, 255, 255, .3); }
  }
</style>
</head>
<body>
<main>
  <div><h1>404</h1><p>Página não encontrada.</p></div>
  <a href="/">Ir para a página inicial</a>
</main>
</body>
</html>
